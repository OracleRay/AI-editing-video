# ==================== 视频剪辑配置 ====================
video:
  # 视频文件路径
  src: "resources/src/videos/邻居也疯狂第4集.mp4"
  temp: "videos/temp/"
  output: "videos/"
  # 视频时长（由ffprobe动态获取）
  
# ==================== 音频配置 ====================
audio:
  # 音频文件命名模式（{:04d}会被替换为0001, 0002等）
  pattern: "audios/{:04d}.mp3"
  # 音频输出目录
  output_dir: "audios"

# ==================== 输出配置 ====================
output:
  # 剪映项目JSON文件输出目录
  json_dir: "json/jieShuo"

# ==================== FFmpeg配置 ====================
ffmpeg:
  # ffprobe可执行文件路径
  ffprobe_path: "resources/src/ffmpeg/ffprobe.exe"
  # ffmpeg可执行文件路径
  ffmpeg_path: "resources/src/ffmpeg/ffmpeg.exe"

# ==================== TTS（文字转语音）配置 ====================
tts:
  # 参考音频路径（用于声音克隆）- 注意：UI中现在从用户上传获取，此处保留作为兼容
  reference_audio: "resources/src/audios/xiao_shuai/爆款小帅男声.MP3"
  # TTS模型名称
  model: "Index-TTS-2"
  # 音频倍速（1.0=原速，>1.0加快，<1.0减慢）- 注意：UI中现在从用户设置获取，此处保留作为兼容
  speed: 1.1
  # 音调
  pitch: 1.2
  # 音量（1.0=原音量）- 注意：UI中现在从用户设置获取，此处保留作为兼容
  volume: 1.0
  # API配置
  api:
    base_url: "http://116.211.238.68:18080"
    api_key: "7462B06678760F8E49DA271D18F793D5"
    submit_endpoint: "/api/v1/tts/submit"
    status_endpoint: "/api/v1/task/status/{task_id}"
  # 轮询配置
  polling:
    interval_sec: 2.0
    timeout_sec: 300

# ==================== 音频转字幕 API 配置 ====================
audio_to_subtitles:
  # API 地址
  api_url: "http://116.211.238.68:18080/api/v1/fast_transcribe"
  # API 密钥
  api_key: "3BC34ACCCF0B1EA2815C40DF6D8AE265"

