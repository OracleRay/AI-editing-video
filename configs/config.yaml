# ==================== 视频剪辑配置 ====================
video:
  # 视频文件路径
  src: "resources/src/videos/邻居也疯狂第4集.mp4"
  temp: "resources/dst/videos/temp/"
  output: "resources/dst/videos/"
  # 视频时长（由ffprobe动态获取）
  
# ==================== 音频配置 ====================
audio:
  # 音频文件命名模式（{:04d}会被替换为0001, 0002等）
  pattern: "resources/dst/audios/{:04d}.mp3"
  # 音频输出目录
  output_dir: "resources/dst/audios"

# ==================== 字幕配置 ====================
srt_file:
  # SRT字幕文件路径
  jieShuo_example: "resources/src/srt_files/金婚风雨情.srt"

# ==================== 输出配置 ====================
output:
  # 剪映项目JSON文件输出目录
  json_dir: "resources/dst/json/jieShuo"

# ==================== FFmpeg配置 ====================
ffmpeg:
  # ffprobe可执行文件路径
  ffprobe_path: "resources/src/ffmpeg/ffprobe.exe"
  # ffmpeg可执行文件路径
  ffmpeg_path: "resources/src/ffmpeg/ffmpeg.exe"

# ==================== TTS（文字转语音）配置 ====================
tts:
  # 参考音频路径（用于声音克隆）
  reference_audio: "resources/src/audios/xiao_shuai/爆款小帅男声.MP3"
  # TTS模型名称
  model: "Index-TTS"
  # 音频倍速（1.0=原速，>1.0加快，<1.0减慢）
  speed: 1.1
  # API配置
  api:
    base_url: "http://116.211.238.68:18080"
    api_key: "7462B06678760F8E49DA271D18F793D5"
    submit_endpoint: "/api/v1/tts/submit"
    status_endpoint: "/api/v1/task/status/{task_id}"
  # 轮询配置
  polling:
    interval_sec: 2.0
    timeout_sec: 300

# ==================== 项目配置 ====================
project:
  # 画布配置
  canvas:
    width: 1920
    height: 1080
    ratio: "16:9"
  # 帧率
  fps: 30

